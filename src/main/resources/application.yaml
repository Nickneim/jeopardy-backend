spring:
  application:
    name: jeopardy
  # Reads the git-ignored .env (KEY=value lines) from the working directory
  # as properties, so the app finds DATABASE_* however it's started: IntelliJ
  # (any run config, even the gutter arrow), bootRun or java -jar. Optional,
  # so without the file nothing changes. Real environment variables still win.
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    # No lazy loading outside a transaction: services build every response
    # that reads lazy associations inside a read-only one.
    open-in-view: false

  # Spring's default error body (for errors ApiExceptionHandler doesn't
  # handle) must not expose internals. These are already Spring's defaults,
  # but spring-boot-devtools switches all three to "always" whenever the app
  # runs from the IDE or bootRun, which sent stack traces to the frontend.
  # Explicit settings win over devtools. To see them while developing, run
  # with the "dev" profile (application-dev.yaml).
  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        # gamesessions: this instance's sessions, which the other instances
        # read for the lobby list (GameSessionsEndpoint). In Kubernetes the
        # management server has its own port (MANAGEMENT_SERVER_PORT), which
        # isn't exposed outside the cluster.
        include: health,gamesessions

app:
  cors:
    # Browser origins allowed to call the REST API and open /ws. Comma-separated
    # when set through ALLOWED_ORIGINS; defaults to the Vite dev server.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  # With several instances, how the lobby list finds the others' sessions
  # (SessionLobbyProperties). Off unless SESSION_PEERS is set.
  session-lobby:
    peers: ${SESSION_PEERS:}
    self-address: ${POD_IP:}
    peer-port: ${management.server.port:${server.port:8080}}
    timeout: 1s
